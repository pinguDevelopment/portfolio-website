version: "3.9"

services:
  web:
    build: .
    container_name: portfolio-web
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    networks:
      - portfolio-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: portfolio-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - portfolio-net
    depends_on:
      - web

networks:
  portfolio-net:
    driver: bridge
